[project]
name = "hinatazaka46-calendar"
version = "0.1.0"
description = "日向坂46のスケジュールをGoogleカレンダーへ自動登録する"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4==4.15.0",
    "google-api-python-client==2.111.0",
    "google-auth-httplib2==0.2.0",
    "google-auth-oauthlib==1.2.0",
    "lxml==6.1.0",
    "mojimoji==0.0.12",
    "python-dateutil==2.8.2",
    "requests>=2.32.5",
    "tendo==0.3.0",
]

[project.scripts]
hinatazaka46-calendar = "hinatazaka46_calendar.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py314"
src = ["src"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "ruff>=0.16.3",
]
